name: Publish to npm

on:
  workflow_run:
    workflows: ["Unit Tests", "E2E Tests"]
    types: [completed]
    branches: [mainline]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'mainline'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify other workflow also passed
        if: steps.version.outputs.changed == 'true'
        run: |
          # Determine which workflow triggered us
          TRIGGER="${{ github.event.workflow_run.name }}"
          if [ "$TRIGGER" == "Unit Tests" ]; then
            OTHER="E2E Tests"
          else
            OTHER="Unit Tests"
          fi

          # Check the other workflow's latest run on mainline
          STATUS=$(gh run list --workflow="$OTHER" --branch=mainline --limit=1 --json conclusion --jq '.[0].conclusion')
          if [ "$STATUS" != "success" ]; then
            echo "::error::$OTHER has not passed (status: $STATUS). Skipping publish."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.changed }}" == "true" ]; then
            echo "### 📦 Published to npm" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Package**: \`@prmichaelsen/firebase-admin-sdk-v8@${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[View on npm](https://www.npmjs.com/package/@prmichaelsen/firebase-admin-sdk-v8/v/${{ steps.version.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
          else
            CURRENT=$(node -p "require('./package.json').version")
            echo "### ⏭️ Publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Version \`$CURRENT\` unchanged — no publish needed." >> "$GITHUB_STEP_SUMMARY"
          fi
