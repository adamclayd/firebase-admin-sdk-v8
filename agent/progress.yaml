blockers:
  - name: Production signed URL failure
    severity: critical
    description: |
      User reports SignatureDoesNotMatch error in production when using signed URLs.
      Error message shows canonical request format issue with bucket path encoding.
      This is BLOCKING production usage of signed URLs.
      
      Error details:
      - Code: SignatureDoesNotMatch
      - Message: Access denied
      - Bucket: com-f5-parm.appspot.com
      - Path: e0_agentbase/users/MnOyIarhz5b8n06TsTovM582NSG2/chat/96cc2737-64aa-47c3-9f5e-4f95c889849a
      
      Canonical request shows:
      - GET /{bucket}/{path}
      - Host: storage.googleapis.com
      - Payload: UNSIGNED-PAYLOAD
      
      Possible issues:
      1. Path encoding problem (special characters, slashes)
      2. Bucket name format issue (.appspot.com vs .firebasestorage.app)
      3. Canonical request format mismatch
      4. Signature algorithm issue
      
      Investigation needed:
      - Compare working e2e test paths vs production paths
      - Check if special characters in path cause issues
      - Verify bucket name handling
      - Test with production-like paths
    
  - name: Security vulnerabilities
    severity: high
    description: Security Audit #001 identified 2 critical and 4 high-priority issues that should be addressed before next release
    tasks:
      - agent/tasks/security-h001-jwt-algorithm-validation.md
      - agent/tasks/security-h002-uid-input-validation.md
      - agent/tasks/security-h003-custom-claims-validation.md
      - agent/tasks/security-h004-signed-url-timing-attack.md

