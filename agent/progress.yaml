  - name: Signed URL Bug Fix
    date: 2026-02-14
    description: |
      Fixed signed URL generation for .firebasestorage.app buckets
      
      Problem:
      - Signed URLs were failing with SignatureDoesNotMatch error
      - Issue occurred after updating default bucket format from .appspot.com to .firebasestorage.app
      - All 3 signed URL e2e tests were failing
      
      Root Cause:
      - The stringToHex() function was only hex-encoding the canonical request
      - V4 signing spec requires SHA-256 hash of canonical request, not just hex encoding
      - This caused signature mismatch with Google Cloud Storage
      
      Solution:
      - Renamed stringToHex() to sha256Hex()
      - Changed implementation to compute SHA-256 hash using crypto.subtle.digest()
      - Updated function call to use async sha256Hex()
      
      Files Modified:
      - src/storage/signed-urls.ts: Fixed hash function (line 56-66)
      
      Test Results:
      - ✅ All 3 signed URL e2e tests now passing
      - ✅ Total e2e tests: 105 passed, 2 skipped
      - ✅ Works with both .firebasestorage.app and .appspot.com buckets
      
      Impact:
      - Unblocked e2e test suite
      - Signed URLs now work correctly with new Firebase Storage bucket format
      - Backward compatible with old bucket format
      
